<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géraldine Recker</title>

<meta name="description" content="Architecture and projects.">
<meta property="og:title" content="Géraldine Recker">
<meta property="og:description" content="Architecture and projects.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://REPLACE-DOMAIN">
<meta property="og:image" content="https://REPLACE-DOMAIN/assets/og.jpg">

<link rel="stylesheet" href="styles.css">

<!-- Landing state is set before anything is painted. Set later, the
     project list would flash up for a frame and then fade away. The
     condition matches the boot section of script.js. -->
<script>
  if (!location.hash &&
      matchMedia('(hover: hover) and (pointer: fine)').matches &&
      !matchMedia('(max-width: 800px)').matches) {
    document.documentElement.classList.add('is-landing');
  }
</script>
</head>
<body>

<!-- Mobile only: the name stays put, "index" opens the list. -->
<header id="bar">
  <a class="brand" href="#" data-nav="home">géraldine recker</a>
  <button id="menu-toggle" aria-label="Open index" aria-expanded="false">index</button>
</header>

<!-- Column 1. One continuous list: name, projects, info, contact. -->
<nav id="sidebar" aria-label="Project index">
  <a class="brand" href="#" data-nav="home">géraldine recker</a>
  <ul id="project-index"></ul>
  <ul class="meta">
    <li><a href="#" data-nav="info">info</a></li>
    <li><a href="mailto:REPLACE@EMAIL.COM">contact</a></li>
  </ul>
</nav>

<main id="main">

  <section id="home" class="view">
    <div class="col-text"></div>
    <div class="col-content">
      <figure class="frame" id="home-cover">
        <img id="cover-image" alt="">
      </figure>
    </div>
  </section>

  <section id="project" class="view" hidden>

    <div class="col-text">
      <h1 id="project-title" class="sr-only"></h1>
      <div id="project-meta"></div>
      <div id="project-text"></div>
    </div>

    <div class="col-content">
      <!-- Carries over the photo that was on screen, so opening a
           project continues from it instead of cutting. -->
      <figure class="frame" id="project-cover">
        <img id="project-cover-image" alt="">
      </figure>
      <div id="project-images"></div>
      <div id="project-media"></div>
    </div>

  </section>

  <section id="info" class="view" hidden>
    <div class="col-text">
      <div id="info-content"></div>
      <p class="colophon">site by <a href="mailto:studio@juliettemartin.org">juliette martin</a></p>
    </div>
    <div class="col-content">
      <!-- Empty until a project title is hovered from the info page. -->
      <figure class="frame" id="info-cover" hidden>
        <img alt="">
      </figure>
    </div>
  </section>

  <div id="error" hidden>
    <p>The project list didn’t load. Reload the page.</p>
  </div>

</main>

<div id="hover-meta" hidden></div>

<!-- Two scroll indicators, same design: the images on the right
     edge, the description in the margin to its left. -->
<div id="scrollbar" class="scroll-indicator" aria-hidden="true">
  <span class="scroll-dot"></span>
</div>

<div id="text-scrollbar" class="scroll-indicator" aria-hidden="true">
  <span class="scroll-dot"></span>
</div>

<div id="cursor" aria-hidden="true">
  <span class="cursor-label"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="script.js"></script>
</body>
</html>
